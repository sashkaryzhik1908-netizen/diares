 
{% extends "base.html" %}

{% block title %}Список опций{% endblock title %}

{% block content %}
<div class="container">
    <h2>Опции для переменной: {{ variable.label }}</h2>
    <br>

    <a href="{{ url_for('edit_variable', variable_id=variable.id) }}"
       class="btn btn-primary btn-sm">
        Редактировать переменную
    </a>

    <form action="{{ url_for('del_variable', variable_id=variable.id) }}"
          method="POST"
          style="display: inline;">
        <button type="submit"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Вы уверены, что хотите удалить переменную?')">
            Удалить переменную
        </button>
    </form>

    <br><hr>

    {% for option in options %}
    <div>
        <h4>
            {{ option.value }}

            <a href="{{ url_for('edit_option', variable_id=variable.id, option_id=option.id) }}"
               class="btn btn-primary btn-sm">
                Редактировать опцию
            </a>

            <form action="{{ url_for('delete_option', variable_id=variable.id, option_id=option.id) }}"
                  method="POST"
                  style="display: inline;">
                <button type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Вы уверены, что хотите удалить опцию?')">
                    Удалить опцию
                </button>
            </form>
        </h4>

        <p>{{ option.output_value }}</p>
        <hr>
    </div>
    {% endfor %}
</div>
{% endblock content %}
